<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EOS – Einlass und Abschluss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceef2;--surface:#ffffff;--soft:#e2e6ee;--ink:#161a22;--muted:#586072;--line:#c6ccd9;
  --accent:#f0b323;--accent-ink:#1b1500;--ok:#17734a;--bad:#b3261e;--okbg:#dff3e8;--badbg:#fbe3e0;
  --disp:'Archivo','Arial Narrow',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141922;--surface:#1c2230;--soft:#262e41;--ink:#eef1f6;--muted:#9ba5b9;--line:#2e3649;
    --accent:#f5c242;--accent-ink:#1b1500;--ok:#4cc38a;--bad:#ff8174;--okbg:#17382a;--badbg:#4a201c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141922;--surface:#1c2230;--soft:#262e41;--ink:#eef1f6;--muted:#9ba5b9;--line:#2e3649;
  --accent:#f5c242;--accent-ink:#1b1500;--ok:#4cc38a;--bad:#ff8174;--okbg:#17382a;--badbg:#4a201c;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%}
main{max-width:720px;margin:0 auto;padding:14px 14px 120px}
h1{font-family:var(--disp);font-weight:800;font-size:1.6rem;margin:6px 0 12px;letter-spacing:-.01em}
h2{font-family:var(--disp);font-weight:600;font-size:1.1rem;margin:0 0 10px}
p{margin:0 0 10px}
.hint{color:var(--muted);font-size:.92rem}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* Tab bar */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;min-width:0;font-size:.85rem;min-height:58px;background:none;border:0;border-top:4px solid transparent;font-weight:700;color:var(--muted);position:relative}
nav button[aria-current="page"]{color:var(--ink);border-top-color:var(--accent)}
.badge{position:absolute;top:6px;right:calc(50% - 34px);background:var(--bad);color:#fff;border-radius:999px;font-size:.75rem;min-width:20px;padding:0 6px;line-height:20px}
.badge[hidden]{display:none}

/* Hero counter */
.hero{display:flex;align-items:baseline;gap:12px;margin:2px 0 6px}
.big{font-family:var(--disp);font-weight:800;font-size:4.4rem;line-height:1;letter-spacing:-.03em}
.bigl{color:var(--muted)}
.sub{color:var(--muted);margin:0 0 12px}
.sub b{color:var(--ink)}

/* Segmented controls */
.seg{display:flex;gap:6px;margin:0 0 10px;background:var(--soft);padding:4px;border-radius:12px}
.seg button{flex:1;min-height:48px;border:0;border-radius:9px;background:transparent;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seglabel{font-size:.9rem;color:var(--muted);margin:0 0 4px 2px}

/* Category buttons */
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:6px 0 18px}
@media (min-width:640px){.cats{grid-template-columns:repeat(3,1fr)}}
.cat{position:relative;text-align:left;min-height:88px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);display:flex;flex-direction:column;justify-content:space-between;transition:transform .08s}
.cat:active{transform:scale(.97);background:var(--soft)}
.cat.free{border-style:dashed}
.cn{font-weight:700;font-size:1.05rem;line-height:1.15;padding-right:46px}
.cp{color:var(--muted);font-size:.9rem;margin-top:8px}
.cc{position:absolute;top:10px;right:10px;min-width:38px;text-align:center;padding:1px 9px;border-radius:999px;font-family:var(--disp);font-weight:800;font-size:1.2rem;background:var(--soft)}
.cc.on{background:var(--accent);color:var(--accent-ink)}

/* Cards, fields */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 14px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{display:flex;flex-direction:column;gap:4px;font-size:.92rem;color:var(--muted)}
input[type=text],input:not([type]),input[type=date],select{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px;width:100%}
input[inputmode]{font-size:1.1rem}
.chk{display:flex;gap:6px;align-items:center;color:var(--ink);font-size:.95rem}
.chk input{width:20px;height:20px}

/* Buttons */
.primary,.ghost,.danger{min-height:48px;padding:0 18px;border-radius:12px;font-weight:700;border:2px solid transparent}
.primary{background:var(--accent);color:var(--accent-ink)}
.ghost{background:transparent;border-color:var(--line)}
.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btns{display:flex;gap:10px;margin-top:12px}
.btns>*{flex:1}

/* Log */
.log{list-style:none;margin:0;padding:0}
.log li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.log li:last-child{border-bottom:0}
.log .t{color:var(--muted);width:44px;flex:none}
.log .d{flex:1}
.log .voided .d{text-decoration:line-through;color:var(--muted)}
.log button{min-height:38px;padding:0 12px;font-size:.9rem}
.empty{color:var(--muted);padding:6px 0}

/* Comparison rows */
.cmp{border-radius:10px;padding:10px 12px;margin:0 0 8px;background:var(--soft);display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center}
.cmp .cl{font-weight:700}
.cmp .cl small{display:block;font-weight:400;color:var(--muted)}
.cmp .cn2{display:flex;gap:14px;grid-column:1;color:var(--muted);font-size:.95rem}
.cmp .cn2 b{color:var(--ink);font-variant-numeric:tabular-nums}
.cmp .cs{grid-column:2;grid-row:1 / span 2;font-weight:700;text-align:right}
.cmp.ok{background:var(--okbg)}.cmp.ok .cs{color:var(--ok)}
.cmp.bad{background:var(--badbg)}.cmp.bad .cs{color:var(--bad)}
.cmp.open .cs{color:var(--muted);font-weight:400}
.cmp.info{grid-template-columns:1fr}
.cmp.info .cn2{grid-column:1;color:var(--ink)}
.status{border-radius:12px;padding:12px 14px;margin:0 0 14px;font-weight:700;background:var(--soft)}
.status.ok{background:var(--okbg);color:var(--ok)}
.status.bad{background:var(--badbg);color:var(--bad)}

/* Formular-Übertrag */
.fsec{margin:0 0 16px}
.fsec h3{font-family:var(--disp);font-weight:600;font-size:1rem;margin:0 0 4px}
.fr{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.fr:last-child{border-bottom:0}
.fr span:first-child{color:var(--muted)}
.fr b{font-variant-numeric:tabular-nums;text-align:right;overflow-wrap:anywhere}

/* Warenkorb */
main.hasbar{padding-bottom:230px}
.cart ul{list-style:none;margin:0;padding:0}
.cart li{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px 10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.cart li:last-child{border-bottom:0}
.cart .cq{font-family:var(--disp);font-weight:800;font-size:1.15rem;min-width:34px}
.cart .cname{font-weight:700;overflow-wrap:anywhere}
.cart .cname small{display:block;font-weight:400;color:var(--muted)}
.cart .cam{font-variant-numeric:tabular-nums;font-weight:700}
.cart .cbtn{display:flex;gap:6px}
.cart .cbtn button{min-height:44px;min-width:44px;padding:0 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-weight:800;font-size:1.1rem}
#cartbar{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:4;background:var(--surface);border-top:2px solid var(--accent);box-shadow:0 -6px 18px rgba(0,0,0,.12)}
#cartbar[hidden]{display:none}
#cartbar .in{max-width:720px;margin:0 auto;padding:10px 14px 12px}
#cartbar .top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
#cartbar .sum{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#cartbar .total{font-family:var(--disp);font-weight:800;font-size:2rem;line-height:1.1;white-space:nowrap}
#cartbar .btns{margin-top:8px}
#cartbar .btns .ghost{flex:0 0 auto}
.dtl summary{cursor:pointer;color:var(--muted);margin:0 0 8px}

/* Gästeliste */
.gl{list-style:none;margin:0;padding:0}
.g{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 8px;display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.g .gn{font-weight:700;font-size:1.08rem;overflow-wrap:anywhere}
.g .gm{color:var(--muted);font-size:.9rem}
.g .gs{font-family:var(--disp);font-weight:800;font-size:1.3rem;white-space:nowrap}
.g .gb{grid-column:1 / -1;display:flex;gap:8px}
.g .gb .primary{flex:1}
.g .gb .ghost{min-width:64px;padding:0 12px}
.g.done{background:var(--okbg);border-color:transparent}
.g.done .gs{color:var(--ok)}
textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:120px}

/* Setup rows */
.crow{display:grid;grid-template-columns:1fr 84px;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.crow:last-of-type{border-bottom:0}
.crow .row2{grid-column:1 / -1;display:flex;gap:10px;align-items:center}
.crow select{flex:1}
.crow .ghost{min-height:42px;padding:0 12px}

/* Sheet + toast */
#sheet{position:fixed;inset:0;background:rgba(10,12,18,.55);z-index:10;display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
.sheet{background:var(--surface);width:100%;max-width:720px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.err{color:var(--bad);font-weight:700;min-height:1.4em;margin:8px 0 0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;z-index:20}
#toast[hidden]{display:none}
pre{white-space:pre-wrap;word-break:break-word;font:.85rem/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin:10px 0 0}
details summary{cursor:pointer;color:var(--muted);margin-top:10px}
@media (prefers-reduced-motion:reduce){.cat{transition:none}}
/* v2 Ergänzungen */
input[type=password]{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px;width:100%}
.topbar{display:flex;gap:10px;align-items:flex-end;margin:0 0 12px}
.evsel{flex:1;display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);min-width:0}
.rolebtn{min-height:46px;padding:0 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:700;white-space:nowrap}
.note{background:var(--soft);border-radius:10px;padding:10px 12px;color:var(--muted);margin:0 0 12px}
.sheet{max-height:92vh;overflow:auto}
.sl{list-style:none;margin:10px 0 0;padding:0;max-height:46vh;overflow:auto}
.sl li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.sl .sn{flex:1;min-width:0}
.sl .sn b{display:block;overflow-wrap:anywhere}
.sl .sn small{color:var(--muted)}
.sl button{min-height:46px;padding:0 14px}
button[disabled]{opacity:.5;cursor:not-allowed}
.crow .row2{flex-wrap:wrap}
.crow select{flex:1;min-width:130px}
.trow{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);align-items:end}
.trow:last-of-type{border-bottom:0}
.rolegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.rolegrid button{min-height:48px;padding:0 14px;border-radius:12px;font-weight:700;border:2px solid transparent}
.rolegrid .primary{background:var(--accent);color:var(--accent-ink)}
.rolegrid .ghost{background:transparent;border-color:var(--line)}
.fgrid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card h3{font-family:var(--disp);font-weight:600;font-size:1rem;margin:14px 0 6px}
.prow{display:grid;grid-template-columns:1fr 120px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.prow:last-of-type{border-bottom:0}
.trow3{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end;padding:8px 0;border-bottom:1px solid var(--line)}
.trow3 .ghost{grid-column:1 / -1}
.trow2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.crow{grid-template-columns:1fr}
.cat[disabled]{opacity:.55}
input[type=time]{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px;width:100%}
.evrow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.evbtn{display:flex;gap:8px;flex:none}
.evbtn button{min-height:44px;padding:0 14px}
.catbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 12px 2px;margin:0 0 14px}
.catbox>summary,.grp>summary{font-weight:700;color:var(--ink);min-height:48px;display:flex;align-items:center;margin:0}
.catbox[open]>summary{margin-bottom:6px}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px 4px;margin:0 0 10px}
.grp[open]>summary{margin-bottom:6px}
.card details>h3,#rangeOut h3{margin-top:14px}
/* v5: Layout-Korrekturen und neue Bausteine */
input,select,textarea{box-sizing:border-box;max-width:100%;min-width:0}
.fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
.fgrid3{grid-template-columns:repeat(3,minmax(0,1fr))}
.f{min-width:0}
details textarea{display:block}
.prow2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 10px;align-items:end;padding:10px 0;border-bottom:1px solid var(--line)}
.prow2 .chk{min-height:46px}
.sec>summary{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:48px;cursor:pointer;font-family:var(--disp);font-weight:600;font-size:1.1rem;color:var(--ink);margin:0}
.sec[open]>summary{margin-bottom:10px}
.sst{font-family:var(--body);font-size:.9rem;font-weight:700;text-align:right}
.sst.ok{color:var(--ok)}.sst.bad{color:var(--bad)}.sst.open{color:var(--muted)}
.note.closedbar{border-left:5px solid var(--accent);color:var(--ink);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.note.closedbar .ghost{min-height:44px;padding:0 14px}
.lrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 10px;align-items:end;padding:10px 0;border-bottom:1px solid var(--line)}
.lrow .hint{margin:0}
/* v6: Verbindung und Anmeldung */
input[type=email]{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px;width:100%;box-sizing:border-box}
.statline{font-size:.85rem;color:var(--muted);margin:-4px 0 10px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:baseline}
.dot.green{background:var(--ok)}.dot.amber{background:var(--accent)}.dot.grey{background:var(--muted)}
.link{background:none;border:0;padding:0;color:inherit;text-decoration:underline;font:inherit;cursor:pointer}
.link.bad{color:var(--bad);font-weight:700}
/* v7: Handy-Layout (nach Test im echten Browser) */
.cats{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:640px){.cats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cat{min-width:0}
.cn,.cp,.gn,.gm{overflow-wrap:anywhere}
.g{min-width:0}
.g>div{min-width:0}
.g .gb{flex-wrap:wrap}
.g .gb .primary{flex:1 1 150px}
.btns{flex-wrap:wrap}
button{max-width:100%}
/* v7b: Kategorie-Knöpfe: Zähler in die untere Zeile, damit der Name die ganze Breite hat */
.cat{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto 1fr;gap:6px 8px;align-content:space-between;text-align:left}
.cat .cn{grid-column:1 / -1;padding-right:0;overflow-wrap:break-word;hyphens:manual;font-size:1rem}
.cat .cp{grid-column:1;align-self:end;margin-top:0;font-size:.85rem}
.cat .cc{position:static;grid-column:2;align-self:end;top:auto;right:auto}
/* v8: Personensuche im Einlass, Einladungen, oeffentliche Seite, Preiszeilen mit Zeit */
.psearch{margin:0 0 14px}
.psearch .sl{max-height:none;overflow:visible;margin-top:8px}
.irow{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:8px 10px;align-items:end;padding:10px 0;border-bottom:1px solid var(--line)}
.irow .ghost{grid-column:1 / -1}
body.pub nav{display:none}
body.pub main{padding-bottom:40px}
.prow2 .chk{align-self:end}
/* v9: Namen volle Breite, Navigation auf sehr schmalen Handys */
.fgrid>.span2{grid-column:1 / -1}
.lrow>label:first-child{grid-column:1 / -1}
@media (max-width:340px){nav button{font-size:.7rem;padding:0 1px;letter-spacing:-.01em}}
nav button{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav button{font-size:.78rem;padding:0 2px}
@media (max-width:340px){nav button{font-size:.68rem}}
</style>
</head>
<body>
<main id="app"></main>
<div id="cartbar" hidden></div>
<div id="sheet" hidden></div>
<div id="toast" hidden></div>
<nav aria-label="Bereiche"></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
(function(){
'use strict';
const PRICE_JACKE=2, PRICE_TASCHE=5;
const ROLES={kasse:'Kasse',gard:'Garderobe',booking:'Booking',prod:'Produktion',admin:'Admin'};
const TABS={kasse:['einlass','gl'],gard:['gard'],booking:['gl','ev'],prod:['einlass','gl','gard','ab','ev'],admin:['einlass','gl','gard','ab','ev']};
const TAB_LABEL={einlass:'Einlass',gl:'Liste',gard:'Garderobe',ab:'Abschluss',ev:'Anlass'};
const NOTEN=[{k:'n200',d:200,row:20},{k:'n100',d:100,row:21},{k:'n50',d:50,row:22,stock:true},{k:'n20',d:20,row:23,stock:true},{k:'n10',d:10,row:24,stock:true}];
const ROLLEN=[{k:'r5',short:'5.–',val:125,row:25},{k:'r2',short:'2.–',val:100,row:26},{k:'r1',short:'1.–',val:50,row:27},{k:'r05',short:'–.50',val:25,row:28}];
const TERM_NRS=[]; for(let i=48;i<=61;i++) TERM_NRS.push(i);

/* ---------- Helfer ---------- */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
function uuid(){
  const b=new Uint8Array(16); (window.crypto||window.msCrypto).getRandomValues(b); b[6]=(b[6]&0x0f)|0x40; b[8]=(b[8]&0x3f)|0x80;
  const h=Array.prototype.map.call(b,x=>('0'+x.toString(16)).slice(-2));
  return h.slice(0,4).join('')+'-'+h.slice(4,6).join('')+'-'+h.slice(6,8).join('')+'-'+h.slice(8,10).join('')+'-'+h.slice(10).join('');
}
const num=v=>{ if(v===''||v==null) return null; const n=parseFloat(String(v).replace(',','.')); return isNaN(n)?null:n; };
const round2=n=>Math.round(n*100)/100;
const chf=n=>n.toLocaleString('de-CH',{minimumFractionDigits:2,maximumFractionDigits:2});
const chfs=n=>Number.isInteger(n)?String(n):chf(n);

const nz = v => (v == null || Number(v) === 0) ? '' : String(Number(v));
const numStr = v => v == null ? '' : String(Number(v));
const CASHCOL = { m: 'coins_chf', r5: 'roll_5', r2: 'roll_2', r1: 'roll_1', r05: 'roll_05', n200: 'note_200', n100: 'note_100', n50: 'note_50', n20: 'note_20', n10: 'note_10' };
const COATCOL = { jFirst: 'jackets_first', jLast: 'jackets_last', jManual: 'jackets_manual', jFree: 'jackets_free',
                  tFirst: 'bags_first', tLast: 'bags_last', tManual: 'bags_manual', tFree: 'bags_free' };
function catSort(id){ const c = T.cats.find(x => x.id === id); return c ? c.sort : 999; }
function priceRows(){ return T.prices.slice().sort((a, b) => catSort(a.category_id) - catSort(b.category_id)); }
function termRows(){ return T.terms.slice().sort((a, b) => a.terminal_nr - b.terminal_nr); }
function listRows(){ return T.lists.slice().sort((a, b) => (Number(b.is_default) - Number(a.is_default)) || String(a.created_at).localeCompare(String(b.created_at))); }

function emptyEvent(){
  const e = { id: null, none: true, name: '', date: today(), closed: true, closedAt: null, entries: [], guests: [], lists: [], plist: [], terms: [],
              ab: {}, gard: {} };
  e.cart = [];
  return e;
}
function buildEvent(){
  const ev = T.events.find(x => x.id === curId);
  if (!ev) return emptyEvent();
  const e = { id: ev.id, none: false, name: ev.name, date: ev.event_date, closed: ev.status === 'closed', closedAt: ev.closed_at ? Date.parse(ev.closed_at) : null };
  e.lists = listRows().map(l => ({ id: l.id, name: l.name, price: l.price == null ? '' : numStr(l.price), fixed: !!l.is_default }));
  e.guests = T.guests.map(g => ({ id: g.id, name: g.name, n: g.party_size, via: g.via || '', list: g.list_id }));
  e.plist = priceRows().map(r => ({ cat: r.category_id, price: r.price == null ? '' : numStr(r.price), on: r.active, from: hm5(r.valid_from), until: hm5(r.valid_until) }));
  e.terms = termRows().map(t => ({ nr: String(t.terminal_nr), use: t.used_at, amt: t.daily_close == null ? '' : numStr(t.daily_close) }));
  e.ab = { gutscheine: ev.vouchers_collected == null ? '' : String(ev.vouchers_collected), vvkScan: ev.vvk_scanned == null ? '' : String(ev.vvk_scanned) };
  e.gard = {};
  Object.keys(COATCOL).forEach(k => { const v = T.coat ? T.coat[COATCOL[k]] : null; e.gard[k] = v == null ? '' : String(v); });
  [['AK', e.ab], ['Garderobe', e.gard]].forEach(([reg, target]) => {
    [['stock', 's'], ['end', 'e']].forEach(([ph, p]) => {
      const row = T.cash.find(r => r.register === reg && r.phase === ph);
      if (row) {
        target[p + '_row'] = true;
        Object.keys(CASHCOL).forEach(k => { target[p + '_' + k] = nz(row[CASHCOL[k]]); });
      }
    });
  });
  e.entries = buildEntries();
  Object.defineProperty(e, 'cart', { get(){ return cartFor(ev.id); }, set(v){ cartMap[ev.id] = v; }, enumerable: true });
  return e;
}
function buildEntries(){
  const txById = {}, stornoed = {};
  T.tx.forEach(t => { txById[t.id] = t; if (t.kind === 'storno') stornoed[t.reverses_id] = true; });
  const out = [];
  T.lines.forEach(l => {
    const t = txById[l.tx_id]; if (!t) return;
    const amt = Number(l.amount);
    out.push({ id: l.id, tx: l.tx_id, ts: Date.parse(t.created_at), cat: l.category_id || ('L:' + l.list_id), name: l.label, qty: l.qty, amount: amt,
               pay: amt !== 0 ? t.pay_method : null, guest: l.guest_id || l.member_id || undefined, who: l.who || undefined,
               voided: t.kind === 'sale' && !!stornoed[t.id], stornoOf: t.kind === 'storno' ? t.reverses_id : undefined });
  });
  // Buchungen, die noch auf dem Geraet warten (kein Netz oder noch nicht bestaetigt)
  const known = new Set(T.tx.map(t => t.id));
  outbox.filter(o => o.event === curId && !o.failed && !known.has(o.id)).forEach(o => {
    if (o.kind === 'checkout') {
      (o.view || []).forEach(v => out.push({ id: o.id + ':' + out.length, tx: o.id, ts: o.ts, cat: v.cat, name: v.name, qty: v.qty, amount: v.amount,
                                            pay: v.amount !== 0 ? o.pay : null, guest: v.guest, who: v.who, voided: false, pending: true }));
    }
  });
  outbox.filter(o => o.event === curId && !o.failed && o.kind === 'storno' && !known.has(o.id)).forEach(o => {
    out.filter(x => x.tx === o.original && !x.stornoOf).forEach(x => {
      x.voided = true;
      out.push({ id: o.id + ':' + out.length, tx: o.id, ts: o.ts, cat: x.cat, name: x.name, qty: -x.qty, amount: -x.amount, pay: x.pay,
                 guest: x.guest, who: x.who, voided: false, stornoOf: x.id, pending: true });
    });
  });
  out.sort((a, b) => (a.ts - b.ts) || String(a.id).localeCompare(String(b.id)));
  return out;
}

async function fetchAll(build){
  const out = [];
  for (let from = 0; ; from += 1000) {
    const r = await build().range(from, from + 999);
    if (r.error) throw r.error;
    out.push(...(r.data || []));
    if ((r.data || []).length < 1000) break;
  }
  return out;
}
function noteNet(ok){ if (netOk !== ok) { netOk = ok; updateStat(); } }

async function pullTx(txId){
  const [t, l] = await Promise.all([sb.from('transactions').select('*').eq('id', txId), sb.from('transaction_lines').select('*').eq('tx_id', txId)]);
  (t.data || []).forEach(r => upsertLocal('transactions', r));
  (l.data || []).forEach(r => upsertLocal('transaction_lines', r));

}

/* ---------- Lokale Tabellen pflegen (fuer Live-Abgleich und eigene Aenderungen) ---------- */
const KEYS = {
  event_prices: r => r.event_id + '|' + r.category_id, event_lists: r => r.id, list_guests: r => r.id,
  event_terminals: r => r.event_id + '|' + r.terminal_nr, cash_counts: r => r.event_id + '|' + r.register + '|' + r.phase,
  transactions: r => r.id, transaction_lines: r => r.id, invite_links: r => r.id, events: r => r.id, members: r => r.id, categories: r => r.id, profiles: r => r.id
};
const TARGET = { event_prices: 'prices', event_lists: 'lists', list_guests: 'guests', event_terminals: 'terms', cash_counts: 'cash',
                 transactions: 'tx', transaction_lines: 'lines', invite_links: 'invites', events: 'events', members: 'members', categories: 'cats', profiles: 'profiles' };
function recentlyEdited(table, row){ return Date.now() - (lastEdit || 0) < 1500 && table !== 'transactions' && table !== 'transaction_lines'; }
function upsertLocal(table, row){
  if (table === 'event_coatcheck') { T.coat = row; return; }
  const arr = T[TARGET[table]], kf = KEYS[table], k = kf(row), i = arr.findIndex(r => kf(r) === k);
  if (i >= 0) arr[i] = Object.assign({}, arr[i], row); else arr.push(row);
}
function removeLocal(table, row){
  if (table === 'event_coatcheck') { T.coat = null; return; }
  const arr = T[TARGET[table]], kf = KEYS[table], k = kf(row), i = arr.findIndex(r => kf(r) === k);
  if (i >= 0) arr.splice(i, 1);
}
function applyChange(table, p){
  if (p.eventType === 'DELETE') { removeLocal(table, p.old || {}); mark(); return; }
  if (recentlyEdited(table, p.new)) return;          // eigene, gerade getippte Werte nicht ueberschreiben
  upsertLocal(table, p.new);
  if (table === 'transactions' || table === 'transaction_lines') {
    // Buchung ist beim Server angekommen: wartende Kopie auf dem Geraet entfernen
    const id = table === 'transactions' ? p.new.id : p.new.tx_id;
    if (outbox.some(o => o.id === id)) { outbox = outbox.filter(o => o.id !== id); saveOutbox(); }
  }
  mark();
}

/* ---------- Server: Live-Abgleich ---------- */
let rt = null, rtWasDown = false;
function stopRealtime(){ if (rt && sb) { try { sb.removeChannel(rt); } catch(e) {} } rt = null; rtState = 'off'; }
function startRealtime(){
  stopRealtime();
  if (!sb || !curId) return;
  const ch = sb.channel('eos-' + curId + '-' + Math.random().toString(36).slice(2, 7));
  const f = 'event_id=eq.' + curId;
  ['event_prices', 'event_lists', 'list_guests', 'event_terminals', 'event_coatcheck', 'cash_counts', 'transactions', 'transaction_lines', 'invite_links']
    .forEach(t => ch.on('postgres_changes', { event: '*', schema: 'public', table: t, filter: f }, p => applyChange(t, p)));
  ch.on('postgres_changes', { event: '*', schema: 'public', table: 'events' }, p => applyChange('events', p));
  ch.on('postgres_changes', { event: '*', schema: 'public', table: 'members' }, p => applyChange('members', p));
  rt = ch;
  ch.subscribe(status => {
    if (status === 'SUBSCRIBED') { rtState = 'live'; if (rtWasDown) { rtWasDown = false; refreshSoft(); } }
    else { rtState = 'down'; rtWasDown = true; }
    updateStat();
  });
}
function busyWrites(){ return Object.keys(timers).length > 0 || (Date.now() - lastEdit) < 3000; }
async function refreshSoft(){
  if (boot !== 'ready' || busyWrites()) return;
  try { await loadStatic(); if (curId) await loadEvent(curId); lastFull = Date.now(); noteNet(true); }
  catch(e) { noteNet(!!(e && e.code)); }
  mark();
}

  loopT = setInterval(() => { if (document.hidden) return; flush(); if (rtState !== 'live' || Date.now() - lastFull > 60000) refreshSoft(); }, 15000);
}

document.addEventListener('visibilitychange', () => { if (!document.hidden && boot === 'ready') { flush(); refreshSoft(); } });

/* ---------- Server: Warteschlange fuer Buchungen (funktioniert auch ohne Netz) ---------- */
function saveOutbox(){ try { localStorage.setItem('eos-outbox', JSON.stringify(outbox)); } catch(e) {} }
function enqueue(item){ outbox.push(item); saveOutbox(); mark(); flush(); }
let flushing = false;
async function flush(){
  if (flushing || !sb || boot !== 'ready') return;
  flushing = true;
  try {
    for (const it of outbox.slice()) {
      if (it.failed) continue;
      const r = await sendItem(it);
      if (r === 'net') break;
    }
  } finally { flushing = false; mark(); }
}
async function sendItem(it){
  let res;
  try {
    res = it.kind === 'checkout'
      ? await sb.rpc('checkout', { p_tx: it.id, p_event: it.event, p_pay: it.pay, p_lines: it.lines, p_device: DEVICE, p_client_ts: new Date(it.ts).toISOString() })
      : await sb.rpc('storno_transaction', { p_new_tx: it.id, p_original: it.original });
  } catch(e) { noteNet(false); return 'net'; }
  if (res.error) {
    const code = res.error.code || '';
    if (!code || /^PGRST3/.test(code) || res.status >= 500) {
      noteNet(!!code);
      if (/^PGRST3/.test(code)) { try { await sb.auth.refreshSession(); } catch(e) {} }
      return 'net';
    }
    it.failed = true; it.error = res.error.message; saveOutbox(); return 'rejected';
  }
  noteNet(true);
  outbox = outbox.filter(x => x !== it); saveOutbox();
  await pullTx(it.id);
  return 'ok';
}

/* ---------- Server: Aenderungen schreiben ---------- */
function errText(e){
  const c = e && e.code, m = (e && e.message) || '';
  if (c === '42501' || /row-level security/.test(m)) return 'Dafür fehlt dir die Berechtigung (oder der Anlass ist abgeschlossen).';
  if (c === '23505') return 'Das gibt es schon.';
  if (c === '23503') return 'Das wird noch verwendet und lässt sich nicht löschen.';
  if (!c) return 'Keine Verbindung. Bitte später nochmals versuchen.';
  return m;
}
async function run(promise){
  let r;
  try { r = await promise; } catch(e) { noteNet(false); toast('Keine Verbindung.'); return null; }
  if (r.error) { noteNet(!!r.error.code); toast(errText(r.error)); setTimeout(refreshSoft, 400); return null; }
  noteNet(true);
  return r.data == null ? [] : r.data;
}
const timers = {}, fns = {};
function touch(){ lastEdit = Date.now(); }
function debounced(key, fn, ms){
  clearTimeout(timers[key]); touch(); fns[key] = fn;
  timers[key] = setTimeout(async () => { delete timers[key]; const f = fns[key]; delete fns[key]; await f(); }, ms || 600);
}
function flushWrites(){
  Object.keys(timers).forEach(k => { clearTimeout(timers[k]); delete timers[k]; const f = fns[k]; delete fns[k]; if (f) f(); });
}
async function writeRows(table, promise){
  const rows = await run(promise);
  if (rows) { rows.forEach(r => upsertLocal(table, r)); mark(); }
  return rows;
}
async function deleteRows(table, promise, rowForLocal){
  const rows = await run(promise);
  if (rows) { (rows.length ? rows : [rowForLocal]).forEach(r => removeLocal(table, r)); mark(); }
  return rows;
}
const intOrNull = v => { const n = num(v); return n == null ? null : Math.max(0, Math.floor(n)); };
const cashPayload = r => ({ event_id: r.event_id, register: r.register, phase: r.phase, coins_chf: r.coins_chf, roll_5: r.roll_5, roll_2: r.roll_2, roll_1: r.roll_1,
                            roll_05: r.roll_05, note_200: r.note_200, note_100: r.note_100, note_50: r.note_50, note_20: r.note_20, note_10: r.note_10 });

// Eingabefelder (data-path) -> passende Tabelle auf dem Server. Wird beim Tippen aufgerufen.
function persistPath(path, value){
  const ev = T.events.find(x => x.id === curId);
  if (!ev || ev.status === 'closed') return;
  const p = path.split('.');          // ['ev', ...]
  touch();
  if (p[1] === 'name' || p[1] === 'date') {
    const col = p[1] === 'name' ? 'name' : 'event_date';
    if (col === 'event_date' && !value) return;
    ev[col] = value;
    debounced('ev:' + col, () => writeRows('events', sb.from('events').update({ [col]: value }).eq('id', ev.id).select()));
  }
  else if (p[1] === 'ab' && (p[2] === 'gutscheine' || p[2] === 'vvkScan')) {
    const col = p[2] === 'gutscheine' ? 'vouchers_collected' : 'vvk_scanned';
    ev[col] = intOrNull(value);
    debounced('ev:' + col, () => writeRows('events', sb.from('events').update({ [col]: ev[col] }).eq('id', ev.id).select()));
  }
  else if ((p[1] === 'ab' || p[1] === 'gard') && /^[se]_/.test(p[2] || '')) {
    const reg = p[1] === 'ab' ? 'AK' : 'Garderobe', ph = p[2][0] === 's' ? 'stock' : 'end', k = p[2].slice(2), col = CASHCOL[k];
    if (!col) return;
    let row = T.cash.find(r => r.register === reg && r.phase === ph);

    debounced('cash:' + reg + ph, () => writeRows('cash_counts', sb.from('cash_counts').upsert(cashPayload(row), { onConflict: 'event_id,register,phase' }).select()), 700);
  }
  else if (p[1] === 'gard' && COATCOL[p[2]]) {
    if (!T.coat) T.coat = { event_id: curId };

    debounced('coat', () => {
      const c = T.coat, pl = { event_id: curId };
      Object.keys(COATCOL).forEach(k => { pl[COATCOL[k]] = c[COATCOL[k]] == null && /Free$/.test(k) ? 0 : (c[COATCOL[k]] == null ? null : c[COATCOL[k]]); });
      return writeRows('event_coatcheck', sb.from('event_coatcheck').upsert(pl, { onConflict: 'event_id' }).select());
    }, 700);
  }
  else if (p[1] === 'terms') {
    const row = termRows()[+p[2]]; if (!row) return;
    if (p[3] === 'amt') { row.daily_close = num(value); debounced('term:' + row.terminal_nr, () => writeRows('event_terminals', sb.from('event_terminals').update({ daily_close: row.daily_close }).match({ event_id: curId, terminal_nr: row.terminal_nr }).select())); }
    else if (p[3] === 'use') { row.used_at = value; writeRows('event_terminals', sb.from('event_terminals').update({ used_at: value }).match({ event_id: curId, terminal_nr: row.terminal_nr }).select()); }
    else if (p[3] === 'nr') {
      const old = Object.assign({}, row), nr = +value;
      (async () => {
        const del = await run(sb.from('event_terminals').delete().match({ event_id: curId, terminal_nr: old.terminal_nr }).select());
        if (del) { removeLocal('event_terminals', old); await writeRows('event_terminals', sb.from('event_terminals').insert({ event_id: curId, terminal_nr: nr, used_at: old.used_at, daily_close: old.daily_close }).select()); }
      })();
    }
  }
  else if (p[1] === 'plist') {
    const row = priceRows()[+p[2]]; if (!row) return;
    if (p[3] === 'until') { const v = value ? value : null; row.valid_until = v; debounced('until:' + row.category_id, async () => { const r = await run(sb.from('event_prices').update({ valid_until: v }).match({ event_id: curId, category_id: row.category_id }).select()); if (r) await reloadPrices(); }); }
    else if (p[3] === 'price') { row.price = num(value); debounced('price:' + row.category_id, () => writeRows('event_prices', sb.from('event_prices').update({ price: row.price }).match({ event_id: curId, category_id: row.category_id }).select())); }
    else if (p[3] === 'on') { row.active = !!value; writeRows('event_prices', sb.from('event_prices').update({ active: !!value }).match({ event_id: curId, category_id: row.category_id }).select()); }
    else if (p[3] === 'cat') {
      const old = Object.assign({}, row);
      (async () => {
        const del = await run(sb.from('event_prices').delete().match({ event_id: curId, category_id: old.category_id }).select());
        if (del) {
          removeLocal('event_prices', old);
          await writeRows('event_prices', sb.from('event_prices').insert({ event_id: curId, category_id: value, price: old.price, active: true, valid_until: old.valid_until || null }).select());
          const c = S.cats.find(x => x.id === value);
          if (c && c.reduced) await reloadPrices();    // Reduziert-Regel (wie add_reduced_price) hier nicht noetig; Stand neu laden
        }
      })();
    }
  }
  else if (p[1] === 'lists') {
    const row = listRows()[+p[2]]; if (!row || row.is_default) return;
    if (p[3] === 'name') { row.name = value; debounced('lname:' + row.id, () => writeRows('event_lists', sb.from('event_lists').update({ name: row.name.trim() }).eq('id', row.id).select())); }
    else if (p[3] === 'price') {
      const pr = String(value).trim() === '' ? null : num(value);
      if (String(value).trim() !== '' && pr == null) return;
      row.price = pr; debounced('lprice:' + row.id, () => writeRows('event_lists', sb.from('event_lists').update({ price: pr }).eq('id', row.id).select()));
    }
  }
  mark();
}

async function startInvite(token){
  boot = 'invite'; inv.token = token; inv.loaded = false; render();
  if (!window.supabase) { inv.loaded = true; inv.err = 'Die Seite konnte nicht geladen werden. Bitte Internetverbindung prüfen und neu laden.'; render(); return; }
  if (!initClient(false)) { inv.loaded = true; inv.err = 'Diese Seite ist nicht eingerichtet.'; render(); return; }
  let r;
  try { r = await sb.rpc('invite_info', { p_token: token }); } catch(e) { inv.loaded = true; inv.err = 'Keine Verbindung. Bitte später nochmals versuchen.'; render(); return; }
  inv.loaded = true;
  if (r.error) { inv.err = r.error.code ? 'Der Link konnte nicht geprüft werden.' : 'Keine Verbindung. Bitte später nochmals versuchen.'; inv.info = null; }
  else inv.info = r.data;
  render();
}
async function submitInvite(){
  const list = inv.rows.filter(r => String(r.name).trim()).map(r => ({ name: String(r.name).trim(), party_size: Number(r.size) }));
  if (!list.length) { inv.err = 'Bitte mindestens einen Namen eintragen.'; return render(); }
  if (list.some(x => x.name.length > 100)) { inv.err = 'Ein Name ist zu lang.'; return render(); }
  const tot = list.reduce((s, x) => s + x.party_size, 0);
  if (tot > inv.info.remaining) { inv.err = 'Das sind mehr Personen als noch möglich (' + inv.info.remaining + ').'; return render(); }
  inv.busy = true; inv.err = ''; render();
  let r;
  try { r = await sb.rpc('submit_invite', { p_token: inv.token, p_guests: list }); } catch(e) { r = { error: { message: '' } }; }
  inv.busy = false;
  if (r.error) { inv.err = r.error.code ? r.error.message : 'Keine Verbindung. Bitte nochmals versuchen. Es wurde nichts eingetragen.'; return render(); }
  inv.done = { n: r.data.accepted, remaining: r.data.remaining, names: list.map(x => x.name + (x.party_size > 1 ? ' +' + (x.party_size - 1) : '')) };
  inv.info.remaining = r.data.remaining; inv.info.open = r.data.remaining > 0;
  inv.rows = [{ name: '', size: 1 }]; render();
}

/* ---------- Anmeldung und Start ---------- */
function initClient(persist){
  const c = cfg();
  if (!c.url || !c.anonKey || !window.supabase) return false;
  const keep = persist !== false;
  sb = window.supabase.createClient(c.url, c.anonKey, { auth: { persistSession: keep, autoRefreshToken: keep, detectSessionInUrl: false } });
  if (keep) sb.auth.onAuthStateChange(evt => { if (evt === 'SIGNED_OUT' && boot === 'ready') { resetSession(); boot = 'login'; render(); } });
  return true;
}
function resetSession(){ stopRealtime(); clearInterval(loopT); me = null; profile = null; role = null; Object.keys(T).forEach(k => { T[k] = Array.isArray(T[k]) ? [] : (k === 'totals' ? {} : null); }); T.coat = null; curId = null; EV = null; evDirty = true; syncS(); }
async function start(){
  const itok = inviteToken(); if (itok) return startInvite(itok);
  boot = 'init'; render();
  if (!window.supabase) { boot = 'error'; bootMsg = 'Die Bibliothek supabase-js konnte nicht geladen werden. Prüfe die Internetverbindung und lade die Seite neu.'; render(); return; }
  if (!initClient()) { boot = 'config'; render(); return; }
  let s;
  try { s = await sb.auth.getSession(); } catch(e) { boot = 'error'; bootMsg = 'Keine Verbindung zum Server.'; render(); return; }
  if (!s.data || !s.data.session) { boot = 'login'; render(); return; }
  await afterLogin(s.data.session.user);
}
async function afterLogin(user){
  me = user;
  const r = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
  if (r.error) { boot = 'error'; bootMsg = 'Profil konnte nicht geladen werden: ' + errText(r.error); render(); return; }
  profile = r.data;
  if (!profile || !profile.active) { boot = 'waiting'; render(); return; }
  role = ROLE_FROM_DB[profile.role]; tab = TABS[role][0]; openState.cats = (role === 'kasse');
  try {
    await loadStatic(); syncS();
    curId = pickEvent();
    if (curId) await loadEvent(curId);
    lastFull = Date.now(); noteNet(true);
  } catch(e) { boot = 'error'; bootMsg = 'Daten konnten nicht geladen werden: ' + errText(e); render(); return; }
  boot = 'ready'; evDirty = true; syncS();
  startRealtime(); startLoops(); render(); flush();
}
async function doLogin(){
  const mail = ($('#lgMail').value || '').trim(), pw = $('#lgPw').value || '';
  if (!mail || !pw) { $('#lgErr').textContent = 'E-Mail und Passwort eintragen.'; return; }
  $('#lgErr').textContent = '';
  let r;
  try { r = await sb.auth.signInWithPassword({ email: mail, password: pw }); } catch(e) { $('#lgErr').textContent = 'Keine Verbindung zum Server.'; return; }
  if (r.error) { $('#lgErr').textContent = /invalid/i.test(r.error.message) ? 'E-Mail oder Passwort stimmt nicht.' : r.error.message; return; }
  await afterLogin(r.data.user);
}
async function doLogout(){ flushWrites(); try { await sb.auth.signOut(); } catch(e) {} resetSession(); boot = 'login'; render(); }
async function selectEvent(id){

const hm5 = t => t ? String(t).slice(0, 5) : '';
function evTime(dateIso, hm){ const a = String(dateIso).split('-').map(Number), b = String(hm).split(':').map(Number); return new Date(a[0], a[1] - 1, a[2] + (b[0] < 6 ? 1 : 0), b[0], b[1] || 0, 0, 0).getTime(); }
function inWindow(r, now){
  const e = E(); if (!e.date) return true;
  if (r.from && now < evTime(e.date, r.from)) return false;
  if (r.until && now >= evTime(e.date, r.until)) return false;
  return true;
}
function prow(c){ return (E().plist||[]).find(r=>r.cat===c.id); }
function remaining(cat){ return peopleFor(cat).reduce((s,g)=>s+Math.max(0,g.n-guestIn(g.id)-guestInCart(g.id)),0); }
function isOn(c){
  if(c.virtual) return remaining(c)>0;
  if(c.kind==='free') return c.active&&(!c.list||remaining(c)>0);
  const r=prow(c); return !!r&&r.on!==false&&inWindow(r,Date.now());
}
function priceOf(c){ if(c.virtual) return c.price; if(c.kind==='free') return 0; const r=prow(c); return r?num(r.price):null; }
function priceMissing(c){ return c.kind==='paid'&&!c.virtual&&isOn(c)&&priceOf(c)==null; }
function unavailable(c){ return c.kind!=='free'&&!isOn(c); }
const lk=path=>(E().closed&&String(path).indexOf('ev.')===0)?' disabled':'';
function blocked(){ if(E().closed){ toast('Dieser Anlass ist abgeschlossen. Nur der Admin kann ihn wieder öffnen.'); return true; } return false; }
function applyReduceRule(catId){
  const c=S.cats.find(x=>x.id===catId); if(!c||!c.reduced) return;
  E().plist.forEach(r=>{
    if(r.cat===catId){ r.on=true; return; }
    const rc=S.cats.find(x=>x.id===r.cat);
    if(r.cat==='normal'||(rc&&rc.reduced&&rc.reduced<c.reduced)) r.on=false;
  });
}
function parts(o,p){
  const m=num(o[p+'_m'])||0; let rolls=0, noten=0;
  ROLLEN.forEach(r=>{ rolls+=(num(o[p+'_'+r.k])||0)*r.val; });
  NOTEN.forEach(n=>{ if(p==='s'&&!n.stock) return; noten+=(num(o[p+'_'+n.k])||0)*n.d; });
  rolls=round2(rolls); noten=round2(noten);
  const any=!!o[p+'_row'];
  return {m:any?m:null,rolls:rolls,noten:noten,total:any?round2(m+rolls+noten):null};
}
const fmtTot=p=>p.total==null?'–':'CHF '+chf(p.total);
const fmtBreak=p=>p.total==null?'–':'Münz '+chf(p.m||0)+' · Rollen '+chf(p.rolls)+' · Noten '+chf(p.noten)+' · Total <b>CHF '+chf(p.total)+'</b>';

/* ---------- Auswertungen ---------- */
function stats(){
  const r={n:0,bar:0,karte:0,byCat:{},byName:{}};
  E().entries.forEach(e=>{
    r.n+=e.qty;
    if(e.pay==='bar') r.bar+=e.amount;
    if(e.pay==='karte') r.karte+=e.amount;
    r.byCat[e.cat]=(r.byCat[e.cat]||0)+e.qty;
    r.byName[e.name]=(r.byName[e.name]||0)+e.qty;
  });
  r.bar=round2(r.bar); r.karte=round2(r.karte);
  return r;
}
function voucherCount(){

function termSum(use){
  let sum=0, any=false;
  E().terms.forEach(t=>{ const v=num(t.amt); if(t.use===use&&v!=null){ sum+=v; any=true; } });
  return {sum:round2(sum),any:any};

function item(label,system,counted,unit,src){
  let d=null,cls='open',status='noch offen';

    d=round2(counted-system);
    if(d===0){cls='ok';status='✓ stimmt';}

function guestInCart(id){ return E().cart.filter(l=>l.guest===id).reduce((s,l)=>s+l.qty,0); }

function listCat(l){ const pr=num(l.price), paid=pr!=null&&pr>0; return {id:'L:'+l.id,name:l.name,kind:paid?'paid':'free',price:paid?pr:0,list:'event',listId:l.id,virtual:true}; }

function evCats(){ return S.cats.filter(c=>c.kind!=='free').concat(E().lists.map(listCat),S.cats.filter(c=>c.kind==='free')); }
function memberPeople(cat){ return S.members.map(x=>({id:x.id,name:x.name,n:1,member:true,cat:cat.id,catName:cat.name})); }
function allGuests(){

function glStats(){
  const gs=E().guests;
  const total=gs.reduce((s,g)=>s+g.n,0), inn=gs.reduce((s,g)=>s+guestIn(g.id),0);
  const mIn=S.members.reduce((s,m)=>s+guestIn(m.id),0);
  return {count:gs.length,total:total,inn:inn,open:Math.max(0,total-inn),mIn:mIn};

function gardSide(first,last,manual,free){
  const m=num(manual); let n=null;
  if(m!=null) n=m; else { const a=num(first),b=num(last); if(a!=null&&b!=null&&b>=a) n=b-a+1; }
  const f=num(free)||0;
  return {n,free:f,paid:n==null?null:Math.max(0,n-f)};
}
function gardData(){
  const g=E().gard;
  const j=gardSide(g.jFirst,g.jLast,g.jManual,g.jFree), t=gardSide(g.tFirst,g.tLast,g.tManual,g.tFree);
  const soll=round2((j.paid||0)*PRICE_JACKE+(t.paid||0)*PRICE_TASCHE);
  const ps=parts(g,'s'), pe=parts(g,'e'), tg=termSum('Garderobe');
  const txt=s=>s.n==null?'noch offen':s.n+' ausgegeben'+(s.free?', davon '+s.free+' ohne Bezahlung':'');
  return {soll:soll,items:[
    {info:true,label:'Jacken ('+PRICE_JACKE+'.–)',text:txt(j)},
    {info:true,label:'Taschen ('+PRICE_TASCHE+'.–)',text:txt(t)},
    item('Umsatz Garderobe (bar + Karte)',soll,(ps.total!=null&&pe.total!=null)?round2(pe.total-ps.total+tg.sum):null,'chf',ps.total==null?'Stock fehlt (Tab Anlass)':'Endbestand − Stock + Karte laut Terminal')
  ],j:j,t:t};
}
function abschlussData(){
  const a=E().ab, st=stats(), ps=parts(a,'s'), pe=parts(a,'e'), tAK=termSum('AK');
  const out={};
  out.ak=[
    item('Bargeld',st.bar,(ps.total!=null&&pe.total!=null)?round2(pe.total-ps.total):null,'chf',ps.total==null?'Stock fehlt (Tab Anlass)':'Endbestand − Stock'),
    item('Karte',st.karte,tAK.any?tAK.sum:null,'chf','System gegen Tagesabschlüsse AK')
  ];
  out.gard=gardData().items;
  const all=st.n, vvk=num(a.vvkScan), miss=termsMissing();
  out.misc=[item('Gutscheine',voucherCount(),num(a.gutscheine),'n','System gegen eingezogene Gutscheine'),
    {info:true,label:'Gesamteinlass',text:vvk==null?(all+' an der Abendkasse, VVK noch offen'):(all+' an der Abendkasse + '+vvk+' VVK = '+(all+vvk))}];
  if(miss.length) out.misc.push({info:true,label:'Tagesabschluss fehlt',text:miss.join(', ')});
  if(E().guests.length){ const g=glStats(); out.misc.push({info:true,label:'Gästelisten',text:g.inn+' von '+g.total+' Personen eingelassen, '+g.open+' noch offen'}); }
  return out;
}

/* ---------- Warenkorb ---------- */
function cartTotal(){ return round2(E().cart.reduce((a,l)=>a+l.amount,0)); }
function cartCount(){ return E().cart.reduce((a,l)=>a+l.qty,0); }
function cartQtyFor(id){ return E().cart.filter(l=>l.cat===id).reduce((a,l)=>a+l.qty,0); }
function cartAdd(cat){
  if(blocked()) return;
  if(unavailable(cat)){ toast('Diese Kategorie ist für diesen Anlass nicht im Einsatz.'); return; }
  if(cat.kind==='custom'){ openSheet(cat); return; }
  if(priceMissing(cat)){ toast('Für diesen Anlass fehlt der Preis. Die Produktion trägt ihn im Tab Anlass ein.'); return; }
  if(cat.list){ openSearch(cat); return; }
  const cart=E().cart;
  let l=cart.find(x=>x.cat===cat.id&&!x.custom&&!x.guest);
  if(!l){ l={id:uid(),cat:cat.id,name:cat.name,kind:cat.kind,price:cat.kind==='free'?0:priceOf(cat),qty:0,amount:0}; cart.push(l); }
  l.qty++; l.amount=round2(l.price*l.qty); save(); render(true);
}
function cartAddGuest(g){
  if(blocked()) return false;
  const cat=catOf(g), rem=g.n-guestIn(g.id)-guestInCart(g.id);
  if(rem<=0) return false;
  if(unavailable(cat)){ toast('Diese Kategorie ist für diesen Anlass nicht im Einsatz.'); return false; }
  if(priceMissing(cat)){ toast('Für diesen Anlass fehlt der Preis.'); return false; }
  const cart=E().cart;
  let l=cart.find(x=>x.guest===g.id);
  if(!l){ l={id:uid(),cat:cat.id,name:cat.name,kind:cat.kind,price:cat.kind==='free'?0:(priceOf(cat)||0),qty:0,amount:0,guest:g.id,who:g.name,max:g.n}; cart.push(l); }
  l.qty++; l.amount=round2(l.price*l.qty); save(); return true;
}
function cartAddCustom(cat,q,a){
  if(blocked()) return;
  const pr=priceOf(cat)||0;
  const l={id:uid(),cat:cat.id,name:cat.name,kind:'custom',custom:true,price:pr,qty:q,amount:a};
  if(pr) l.ref=pr*q;
  E().cart.push(l); save(); render(true);
}
function cartChange(id,delta){
  if(blocked()) return;
  const cart=E().cart, i=cart.findIndex(x=>x.id===id); if(i<0) return; const l=cart[i];
  if(l.custom||l.qty+delta<=0){ cart.splice(i,1); }
  else {
    if(delta>0&&l.guest&&(l.max-guestIn(l.guest)-l.qty)<=0){ toast('Mehr Personen sind für diesen Eintrag nicht auf der Liste'); return; }
    l.qty+=delta; l.amount=round2(l.price*l.qty);
  }
  save(); render(true);
}
function toRpcLine(l){
  if(String(l.cat).indexOf('L:')===0) return {list_id:String(l.cat).slice(2),guest_id:l.guest,qty:l.qty};
  if(l.guest) return {category_id:l.cat,member_id:l.guest,qty:l.qty};
  if(l.custom) return {category_id:l.cat,qty:l.qty,amount:l.amount};
  return {category_id:l.cat,qty:l.qty};
}
function checkout(pay){
  if(blocked()) return;
  const e=E(); if(!e.cart.length) return;
  const tot=cartTotal(), n=cartCount(), cart=e.cart.slice();
  e.cart=[]; save();
  enqueue({kind:'checkout',id:uuid(),event:e.id,pay:tot>0?pay:null,lines:cart.map(toRpcLine),
           view:cart.map(l=>({cat:l.cat,name:l.name,qty:l.qty,amount:l.amount,guest:l.guest,who:l.who})),ts:Date.now()});
  render(true);
  toast(tot>0?'Kassiert: CHF '+chfs(tot)+(pay==='bar'?' bar':' Karte'):n+(n===1?' Person eingelassen':' Personen eingelassen'));
}
function bookDirect(cat,g){
  if(blocked()) return;
  const l={cat:cat.id,name:cat.name,qty:1,amount:0,guest:g.id,who:g.name};
  enqueue({kind:'checkout',id:uuid(),event:E().id,pay:null,lines:[toRpcLine(l)],view:[l],ts:Date.now()});
  render(true);
}
function logGroups(){
  const map={}, order=[];
  E().entries.forEach(e=>{
    const k=e.tx||e.id;
    if(!map[k]){ map[k]={tx:k,ts:e.ts,storno:!!e.stornoOf,items:[],bar:0,karte:0,voided:true,who:[],pending:false}; order.push(k); }
    const g=map[k]; g.items.push(e); if(e.pending) g.pending=true;
    if(e.pay==='bar') g.bar=round2(g.bar+e.amount);
    if(e.pay==='karte') g.karte=round2(g.karte+e.amount);
    if(!e.voided&&!e.stornoOf) g.voided=false;
    if(e.who&&g.who.indexOf(e.who)<0) g.who.push(e.who);
  });
  return order.map(k=>map[k]);
}
function groupText(g){
  const by={}, names=[];
  g.items.forEach(e=>{ if(by[e.name]==null){by[e.name]=0;names.push(e.name);} by[e.name]+=Math.abs(e.qty); });
  return names.map(n=>by[n]+'× '+n).join(', ');
}

/* ---------- Zeitauswertung ---------- */
const pad2=n=>('0'+n).slice(-2);
function parseHM(v){ const m=/^(\d{1,2}):(\d{2})$/.exec(v||''); return m?(+m[1])*60+(+m[2]):null; }
function inRange(ts){
  const f=parseHM(rFrom), t=parseHM(rTo);
  if(f==null&&t==null) return true;
  const d=new Date(ts), m=d.getHours()*60+d.getMinutes();
  if(f!=null&&t!=null) return f<=t?(m>=f&&m<=t):(m>=f||m<=t);
  return f!=null?m>=f:m<=t;
}
function rangeHtml(){
  const filtered=parseHM(rFrom)!=null||parseHM(rTo)!=null;
  const r={n:0,bar:0,karte:0,byName:{}};
  E().entries.forEach(e=>{
    if(!inRange(e.ts)) return;
    r.n+=e.qty; if(e.pay==='bar') r.bar+=e.amount; if(e.pay==='karte') r.karte+=e.amount;
    r.byName[e.name]=(r.byName[e.name]||0)+e.qty;
  });
  r.bar=round2(r.bar); r.karte=round2(r.karte);
  const names=Object.keys(r.byName).filter(n=>r.byName[n]!==0);
  let h='<p class="sub" style="margin:8px 0">'+(filtered?'Zeitraum '+esc(rFrom||'Anfang')+' bis '+esc(rTo||'Ende')+': ':'Ganzer Abend: ')+
    '<b>'+r.n+'</b> Personen · bar <b>CHF '+chf(r.bar)+'</b> · Karte <b>CHF '+chf(r.karte)+'</b></p>';
  h+=names.length?'<ul class="log">'+names.map(n=>'<li>'+esc(n)+': <b>'+r.byName[n]+'</b></li>').join('')+'</ul>':'<p class="empty">'+(filtered?'In diesem Zeitraum wurde nichts gebucht.':'Noch nichts gebucht.')+'</p>';
  const hb={}, order=[];
  E().entries.forEach(e=>{
    const d=new Date(e.ts), k=d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()+'-'+d.getHours();
    if(!hb[k]){ hb[k]={h:d.getHours(),n:0,amt:0}; order.push(k); }
    hb[k].n+=e.qty; hb[k].amt+=e.amount;
  });
  if(order.length) h+='<h3>Pro Stunde (ganzer Abend)</h3><ul class="log">'+order.map(k=>{ const b=hb[k]; return '<li>'+pad2(b.h)+':00 bis '+pad2((b.h+1)%24)+':00: <b>'+b.n+'</b> Personen · CHF '+chf(round2(b.amt))+'</li>'; }).join('')+'</ul>';
  return h+(filtered||order.length?'<p class="hint">Stornos zählen zum Zeitpunkt der Stornierung.</p>':'');
}
function rangeControls(){
  return '<div class="fgrid" style="margin-top:8px"><label class="f"><span>Von (Uhrzeit)</span><input id="rFrom" type="time" value="'+esc(rFrom)+'"></label>'+
    '<label class="f"><span>Bis (Uhrzeit)</span><input id="rTo" type="time" value="'+esc(rTo)+'"></label></div>'+
    '<div class="btns"><button class="ghost" data-range="30">Letzte 30 Min</button><button class="ghost" data-range="60">Letzte 60 Min</button><button class="ghost" data-range="0">Ganzer Abend</button></div>';

}

function parseImport(txt){
  return txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
    const parts=l.split(/\t|;|\|/).map(x=>x.trim()).filter((x,i)=>i===0||x!=='');
    let name=parts[0], n=1, via='';
    const m=name.match(/^(.*?)\s*\+\s*(\d+)$/); if(m){ name=m[1].trim(); n=1+parseInt(m[2],10); }
    parts.slice(1).forEach(p=>{ if(/^\d+$/.test(p)){ const k=parseInt(p,10); if(k>=1) n=k; } else via=via?via+' '+p:p; });
    return {name:name,n:n,via:via};
  }).filter(x=>x.name);
}

function summarize(items){
  const its=items.filter(i=>!i.info), bad=its.filter(i=>i.cls==='bad').length, open=its.filter(i=>i.cls==='open').length;
  if(bad) return {cls:'bad',text:'! '+bad+(bad===1?' Differenz':' Differenzen')};
  if(open) return {cls:'open',text:open+' offen'};
  return {cls:'ok',text:'✓ stimmt'};
}
function sumInfo(k,ad){
  if(k==='sum-ak') return summarize(ad.ak);

  if(k==='sum-term'){ if(!E().terms.length) return {cls:'open',text:'keine Terminals'}; const m=termsMissing().length; return m?{cls:'open',text:m+' offen'}:{cls:'ok',text:'✓ erfasst'}; }
  return {cls:'',text:''};
}

  const any=parts(o,pfx).total!=null;
  const val=k=>{ const c=num(o[pfx+'_'+k]); return any?String(c==null?0:c):'–'; };
  const rows=[];
  NOTEN.filter(n=>big||n.stock).forEach(n=>rows.push([n.d+'.– Anzahl ('+col+n.row+')',val(n.k)]));
  ROLLEN.forEach(r=>rows.push([r.short+' Rolle, Anzahl ('+col+r.row+')',val(r.k)]));
  return rows;
}

$('#app').addEventListener('click', async e => {
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset;
  /* Start- und Anmeldebildschirme */
  if (boot === 'invite') {
    if (d.act === 'inv-add') { if (inv.rows.length < 20) inv.rows.push({ name: '', size: 1 }); return render(); }
    if (d.act === 'inv-del') { inv.rows.splice(+d.i, 1); if (!inv.rows.length) inv.rows.push({ name: '', size: 1 }); return render(); }
    if (d.act === 'inv-send') return submitInvite();
    if (d.act === 'inv-more') { inv.done = null; inv.err = ''; return render(); }
    return;
  }
  if (d.act === 'login') return doLogin();
  if (d.act === 'saveconfig') {
    const url = ($('#cfgUrl').value || '').trim().replace(/\/+$/, ''), key = ($('#cfgKey').value || '').trim();
    if (!/^https?:\/\//.test(url) || key.length < 20) { $('#cfgErr').textContent = 'Bitte die Projekt-URL und den anon-Schlüssel eintragen.'; return; }
    try { localStorage.setItem(CFG_KEY, JSON.stringify({ url: url, anonKey: key })); } catch(e2) {}
    return start();
  }
  if (d.act === 'resetconfig') { try { localStorage.removeItem(CFG_KEY); } catch(e2) {} boot = 'config'; return render(); }
  if (d.act === 'recheck') return start();
  if (d.act === 'logout') return doLogout();
  if (boot !== 'ready') return;

  if (d.cat) { const c = findCat(d.cat); if (c) cartAdd(c); }
  else if (d.storno) {
    if (outbox.some(o => o.kind === 'storno' && o.original === d.storno)) return;
    if (blocked()) return;
    enqueue({ kind: 'storno', id: uuid(), event: curId, original: d.storno, ts: Date.now() });
  }
  else if (d.cinc) { cartChange(d.cinc, 1); }
  else if (d.cdec) { cartChange(d.cdec, -1); }
  else if (d.cdel) { cartChange(d.cdel, -1); }
  else if (d.gin) {
    const g = allGuests().find(x => x.id === d.gin); if (!g) return;
    const rem = g.n - guestIn(g.id) - guestInCart(g.id); if (rem <= 0) { toast('Komplett eingelassen oder schon im Warenkorb'); return; }
    const cat = catOf(g);
    if (cat.kind === 'free' && !guestInCart(g.id)) bookDirect(cat, g);
    else if (cartAddGuest(g)) { render(true); toast(g.name + ' liegt im Warenkorb (Tab Einlass)'); }
  }
  else if (d.gout) {
    const last = E().entries.slice().reverse().find(x => x.guest === d.gout && !x.voided && !x.stornoOf);
    if (!last) return;
    if (E().entries.filter(x => x.tx === last.tx && !x.stornoOf).length > 1) { toast('Diese Buchung enthält weitere Einträge. Bitte im Einlass-Log stornieren.'); return; }
    if (blocked()) return;
    enqueue({ kind: 'storno', id: uuid(), event: curId, original: last.tx, ts: Date.now() });
  }
  else if (d.gplus) {
    if (!isPlanner()) return denied(); if (blocked()) return;
    const g = T.guests.find(x => x.id === d.gplus); if (!g) return;
    writeRows('list_guests', sb.from('list_guests').update({ party_size: g.party_size + 1 }).eq('id', g.id).select());
  }
  else if (d.gdel) {
    const isM = T.members.some(m => m.id === d.gdel);
    if (isM) { if (!isAdmin()) return denied(); writeRows('members', sb.from('members').update({ active: false }).eq('id', d.gdel).select()); }
    else { if (!isPlanner()) return denied(); if (blocked()) return; deleteRows('list_guests', sb.from('list_guests').delete().eq('id', d.gdel).select(), { id: d.gdel }); }
  }
  else if (d.delterm) {
    if (!isProd()) return denied(); if (blocked()) return;
    const row = termRows()[+d.delterm]; if (!row) return;
    deleteRows('event_terminals', sb.from('event_terminals').delete().match({ event_id: curId, terminal_nr: row.terminal_nr }).select(), row);
  }
  else if (d.delprice) {
    if (!isProd()) return denied(); if (blocked()) return;
    const row = priceRows()[+d.delprice]; if (!row) return;
    deleteRows('event_prices', sb.from('event_prices').delete().match({ event_id: curId, category_id: row.category_id }).select(), row);
  }
  else if (d.act === 'role') { openAccount(); }
  else if (d.act === 'outbox') { openOutbox(); }
  else if (d.act === 'copy') { copyText(summaryText()); }
  else if (d.act === 'addterm') {
    if (!isProd()) return denied(); if (blocked()) return;
    const used = E().terms.map(x => String(x.nr)), free = TERM_NRS.filter(n => used.indexOf(String(n)) < 0);
    if (!free.length) { toast('Alle Terminals sind vergeben'); return; }
    writeRows('event_terminals', sb.from('event_terminals').insert({ event_id: curId, terminal_nr: free[0], used_at: 'AK' }).select());
  }
  else if (d.act === 'addprice') {
    if (!isProd()) return denied(); if (blocked()) return;
    const used = E().plist.map(r => r.cat), c = S.cats.find(x => x.kind !== 'free' && x.active && !x.reduced && used.indexOf(x.id) < 0);
    if (!c) { toast('Alle Kategorien sind schon eingetragen. Für reduzierte Preise gibt es den eigenen Knopf.'); return; }
    writeRows('event_prices', sb.from('event_prices').insert({ event_id: curId, category_id: c.id, price: null, active: true }).select());
  }
  else if (d.act === 'addreduced') {
    if (!isProd()) return denied(); if (blocked()) return;
    const r = await run(sb.rpc('add_reduced_price', { p_event: curId, p_price: null }));
    if (r !== null) { await reloadPrices(); toast('Reduzierte Stufe angelegt. Normal und frühere reduzierte Preise sind jetzt deaktiviert.'); }
  }
  else if (d.act === 'copyprices') {
    if (!isProd()) return denied(); if (blocked()) return;
    const from = $('#copyFrom').value; if (!from) return;
    const src = await run(sb.from('event_prices').select('*').eq('event_id', from)); if (!src) return;
    const del = await run(sb.from('event_prices').delete().eq('event_id', curId).select()); if (!del) return;
    if (src.length) await run(sb.from('event_prices').insert(src.map(r => ({ event_id: curId, category_id: r.category_id, price: r.price, active: r.active, valid_until: r.valid_until || null })))) ;
    await reloadPrices(); toast('Preise übernommen. Bitte kurz prüfen.');
  }
  else if (d.act === 'addcat') { if (!isAdmin()) return denied(); writeRows('categories', sb.from('categories').insert({ id: 'c' + uid(), name: 'Neue Kategorie', kind: 'paid', sort: 200 }).select()); }
  else if (d.act === 'delcat') {
    if (!isAdmin()) return denied();
    const c = T.cats[+d.i]; if (!c) return;
    confirmTap(t, 'delcat' + c.id, () => deleteRows('categories', sb.from('categories').delete().eq('id', c.id).select(), c), 'Sicher? Nochmals tippen');
  }
  else if (d.act === 'newevent') {
    if (!isPlanner()) return denied();
    const rows = await run(sb.from('events').insert({ name: 'Neuer Anlass', event_date: today() }).select());
    if (rows && rows[0]) { upsertLocal('events', rows[0]); await loadStatic(); syncS(); await selectEvent(rows[0].id); render(); toast('Anlass angelegt. Bitte Namen, Preise, Stock und Terminals eintragen.'); }
  }
  else if (d.evsel) { await selectEvent(d.evsel); render(); }
  else if (d.evdel) {
    const ev = S.events.find(x => x.id === d.evdel); if (!ev) return;
    if (!(isAdmin() || (isProd() && !ev.nb && !cartLen(ev.id)))) return denied();
    confirmTap(t, 'evdel' + ev.id, async () => {
      const r = await run(sb.from('events').delete().eq('id', ev.id).select());
      if (r === null) return;
      if (!r.length) { toast('Der Anlass konnte nicht gelöscht werden (Berechtigung).'); return; }
      T.events = T.events.filter(x => x.id !== ev.id); syncS();
      if (curId === ev.id) { curId = pickEvent(); if (curId) await selectEvent(curId); else { stopRealtime(); mark(); } }
      render(true); toast('Anlass gelöscht');
    }, 'Sicher? Nochmals tippen');
  }
  else if (d.range !== undefined) {
    const mins = +d.range;
    if (!mins) { rFrom = ''; rTo = ''; }
    else { const now = new Date(), from = new Date(now.getTime() - mins * 60000); rFrom = pad2(from.getHours()) + ':' + pad2(from.getMinutes()); rTo = pad2(now.getHours()) + ':' + pad2(now.getMinutes()); }
    $('#rFrom').value = rFrom; $('#rTo').value = rTo; $('#rangeOut').innerHTML = rangeHtml();
  }
  else if (d.act === 'addinvite') {
    if (!isPlanner()) return denied(); if (blocked()) return;
    const list = $('#invList').value, via = ($('#invVia').value || '').trim(), quota = num($('#invQuota').value), exp = $('#invExp').value;
    if (!via) { $('#invErr').textContent = 'Bitte eintragen, von wem die Gäste kommen (z. B. Name der Band).'; return; }
    if (quota == null || quota < 1 || !Number.isInteger(quota)) { $('#invErr').textContent = 'Anzahl Personen als ganze Zahl eintragen.'; return; }
    let expIso = null;
    if (exp) { const a = exp.split('-').map(Number); expIso = new Date(a[0], a[1] - 1, a[2], 23, 59, 59).toISOString(); }
    $('#invErr').textContent = '';
    const r = await run(sb.rpc('create_invite', { p_event: curId, p_list: list, p_via: via, p_quota: quota, p_expires: expIso }));
    if (r) {
      const url = location.origin + location.pathname + '#einladung=' + r;
      const inv = await sb.from('invite_links').select('id,event_id,list_id,via,quota,used,expires_at,revoked,created_at').eq('event_id', curId).order('created_at');
      if (inv.data) { T.invites = inv.data; mark(); }
      openLink(url, via);
    }
  }
  else if (d.invrev) {
    if (!isPlanner()) return denied();
    confirmTap(t, 'invrev' + d.invrev, () => writeRows('invite_links', sb.from('invite_links').update({ revoked: true }).eq('id', d.invrev).select()), 'Sicher? Nochmals tippen');
  }
  else if (d.padd) {
    const g = allGuests().find(x => x.id === d.padd); if (!g) return;
    if (cartAddGuest(g)) render(true);
  }
  else if (d.act === 'addlist') {
    if (!isPlanner()) return denied(); if (blocked()) return;
    const name = ($('#lName').value || '').trim(), ptxt = ($('#lPrice').value || '').trim(), pr = num(ptxt);
    if (!name) { $('#lErr').textContent = 'Name der Liste eintragen.'; return; }
    if (E().lists.some(l => norm(l.name) === norm(name))) { $('#lErr').textContent = 'Eine Liste mit diesem Namen gibt es schon.'; return; }
    if (ptxt !== '' && (pr == null || pr < 0)) { $('#lErr').textContent = 'Preis als Zahl eintragen oder leer lassen.'; return; }
    const rows = await writeRows('event_lists', sb.from('event_lists').insert({ event_id: curId, name: name, price: ptxt === '' ? null : pr }).select());
    if (rows) toast('Liste «' + name + '» angelegt' + (pr > 0 ? ' (CHF ' + chfs(pr) + ')' : ' (gratis)'));
  }
  else if (d.dellist) {
    if (!isPlanner()) return denied(); if (blocked()) return;
    const l = T.lists.find(x => x.id === d.dellist); if (!l || l.is_default) return;
    if (T.guests.some(g => g.list_id === l.id && guestIn(g.id) > 0)) { toast('Es sind schon Gäste dieser Liste eingelassen.'); return; }
    confirmTap(t, 'dellist' + l.id, async () => {
      const r = await run(sb.from('event_lists').delete().eq('id', l.id).select());
      if (r) { removeLocal('event_lists', l); T.guests = T.guests.filter(g => g.list_id !== l.id); E().cart = E().cart.filter(x => x.cat !== 'L:' + l.id); save(); mark(); toast('Liste «' + l.name + '» entfernt'); }
    }, 'Sicher? Nochmals tippen');
  }
  else if (d.act === 'addguest') {
    if (!isPlanner()) return denied(); if (blocked()) return;
    const name = $('#gName').value.trim(), n = num($('#gN').value);
    if (!name) { $('#gErr').textContent = 'Name eintragen.'; return; }
    if (n == null || n < 1 || !Number.isInteger(n)) { $('#gErr').textContent = 'Anzahl als ganze Zahl eintragen.'; return; }
    const k = await addGuestsServer([{ name: name, n: n, via: ($('#gVia').value || '').trim() }], $('#gList').value);
    if (k) { toast(name + ' hinzugefügt'); const f = $('#gName'); if (f) f.focus(); }
  }
  else if (d.act === 'importguests') {
    if (!isPlanner()) return denied(); if (blocked()) return;
    const arr = parseImport($('#gImp').value);
    if (!arr.length) { $('#gImpErr').textContent = 'Keine Namen gefunden.'; return; }
    const k = await addGuestsServer(arr, $('#gImpList').value);
    if (k) toast(k + ' Einträge hinzugefügt');
  }
  else if (d.act === 'addmember') {
    if (!isAdmin()) return denied();
    const name = $('#mName').value.trim(); if (!name) { $('#mErr').textContent = 'Name eintragen.'; return; }
    const k = await addMembersServer([{ name: name }]); if (k) toast(name + ' hinzugefügt');
  }
  else if (d.act === 'importmembers') {
    if (!isAdmin()) return denied();
    const arr = parseImport($('#mImp').value).map(x => ({ name: x.name }));
    if (!arr.length) { $('#mImpErr').textContent = 'Keine Namen gefunden.'; return; }
    const k = await addMembersServer(arr); if (k) toast(k + ' Mitglieder hinzugefügt');
  }
  else if (d.act === 'closeevent') {
    if (!isProd()) return denied();
    if (E().closed) return;
    if (E().cart.length) { toast('Bitte zuerst den Warenkorb leeren oder einkassieren.'); return; }
    if (outbox.some(o => o.event === curId)) { toast('Es warten noch Buchungen auf das Senden. Erst Verbindung abwarten.'); return; }
    const its = allItems(abschlussData()), bad = its.filter(i => i.cls === 'bad').length, open = its.filter(i => i.cls === 'open').length;
    const ask = (bad || open) ? ('Noch ' + (bad ? bad + (bad === 1 ? ' Differenz' : ' Differenzen') : '') + (bad && open ? ' und ' : '') + (open ? open + ' offen' : '') + '. Trotzdem abschliessen? Nochmals tippen') : 'Wirklich abschliessen? Nochmals tippen';
    confirmTap(t, 'close', async () => { flushWrites(); const r = await run(sb.rpc('close_event', { p_event: curId })); if (r !== null) { await refreshSoftForce(); toast('Anlass abgeschlossen'); } }, ask);
  }
  else if (d.act === 'reopenevent') {
    if (!isAdmin()) return denied();
    confirmTap(t, 'reopen', async () => { const r = await run(sb.rpc('reopen_event', { p_event: curId })); if (r !== null) { await refreshSoftForce(); toast('Anlass wieder geöffnet'); } }, 'Wieder öffnen? Nochmals tippen');
  }
});
async function refreshSoftForce(){ try { await loadStatic(); if (curId) await loadEvent(curId); noteNet(true); } catch(e) {} mark(); }

$('#app').addEventListener('input', e => {
  const t = e.target;
  if (boot === 'invite') {
    if (t.dataset.ir !== undefined) { const r = inv.rows[+t.dataset.ir]; if (r) { r[t.dataset.f] = t.value; const el = $('#invTot'); if (el) el.innerHTML = 'Eingetragen: <b>' + invTotal() + '</b> von ' + inv.info.remaining; if (t.dataset.f === 'size') { /* keine Neuzeichnung noetig */ } } }
    return;
  }
  if (t.id === 'evSel') { selectEvent(t.value).then(() => render()); return; }
  if (t.id === 'rFrom' || t.id === 'rTo') { rFrom = $('#rFrom').value; rTo = $('#rTo').value; $('#rangeOut').innerHTML = rangeHtml(); return; }
  if (t.id === 'pSearch') { pQuery = t.value; $('#pResults').innerHTML = pResultsHtml(); return; }
  if (t.id === 'gSearch') { gSearch = t.value; $('#glList').innerHTML = guestRows(); return; }
  if (t.dataset.path) {
    if (E().closed && t.dataset.path.indexOf('ev.') === 0) return;
    persistPath(t.dataset.path, t.type === 'checkbox' ? t.checked : t.value);
    if (/^ev\.(plist\.\d+\.cat|terms\.\d+\.nr)$/.test(t.dataset.path)) { setTimeout(() => render(true), 350); return; }
    if (t.dataset.path === 'ev.name' || t.dataset.path === 'ev.date') { const o = $('#evSel option:checked'); if (o) o.textContent = (E().name || 'ohne Namen') + ' · ' + dmy(E().date).slice(0, 5); }
    return;
  }
  if (t.dataset.ci !== undefined) {
    if (!isAdmin()) return;
    const c = T.cats[+t.dataset.ci], f = t.dataset.f; if (!c) return;
    const patch = f === 'active' ? { active: t.checked } : f === 'kind' ? { kind: t.value } : f === 'list' ? { list_source: t.value === 'members' ? 'members' : 'none' } : { name: t.value };
    Object.assign(c, patch); mark();
    debounced('cat:' + c.id, () => writeRows('categories', sb.from('categories').update(patch).eq('id', c.id).select()));
    return;
  }
  if (t.dataset.pi !== undefined) {
    if (!isAdmin()) return;
    const p = T.profiles[+t.dataset.pi], f = t.dataset.f; if (!p || p.id === me.id) return;
    const patch = f === 'active' ? { active: t.checked } : { role: t.value };
    Object.assign(p, patch);
    writeRows('profiles', sb.from('profiles').update(patch).eq('id', p.id).select());
  }
});
$('#app').addEventListener('toggle', e => {
  const el = e.target; if (!el || !el.dataset || el.dataset.open === undefined) return;
  const k = el.dataset.open;
  if (k.indexOf('grp:') === 0 && gSearch.trim()) return;
  openState[k] = el.open;
}, true);
$('#cartbar').addEventListener('click', e => {
  const b = e.target.closest('[data-cb]'); if (!b) return;
  if (b.dataset.cb === 'clear') { E().cart = []; save(); render(true); } else checkout(b.dataset.cb);
});
$('nav').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return; tab = b.dataset.tab; render();
});

start();

})();

</script>
</body>
